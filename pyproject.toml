[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atomic-rl"
version = "0.1.0"
description = "A high-performance, researcher-centric Reinforcement Learning library for PyTorch built on the Functional Core, Imperative Shell design pattern."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Jonathan Lamontange-Kratz" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch",
    "numpy",
    "gymnasium",
    "tensordict",
    "matplotlib",
    "pillow",
    "imageio",
    "einops",
    "wandb",
    "tqdm",
    "pyyaml",
    "typing_extensions",
    "pandas",
    "pygame",
]

[project.urls]
Homepage = "https://github.com/epicgamer17/modular-rl"
Repository = "https://github.com/epicgamer17/modular-rl"

[project.optional-dependencies]
envs = [
    "pettingzoo",
    "catanatron",
    "rlcard",
    "easydict",
]
examples = [
    "ray",
    "torchvision",
    "gym_microrts",
]
test = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-rerunfailures",
]
plot = [
    "SciencePlots>=2.1.0",
    "catppuccin-matplotlib>=0.5",
    "mplcyberpunk>=0.7.1",
    "matplotx>=0.3.10",
    "aquarel>=0.0.6",
    "qbstyles>=0.1.4",
]

[tool.setuptools.packages.find]
include = ["functional", "networks", "envs", "envs.*"]

[tool.setuptools]
exclude-package-data = { envs = ["wrappers/deprecated/*", "custom/setup.py"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["functional", "networks"]
omit = [
    "**/deprecated/**",
    "tests/**",
    "experiments/**",
    "scripts/**",
    "**/__init__.py",
]

[tool.coverage.report]
omit = [
    "**/deprecated/**",
    "tests/**",
    "experiments/**",
    "scripts/**",
    "**/__init__.py",
]
