[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-research"
version = "0.1.0"
description = "Reinforcement Learning Research Codebase"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "numpy",
    "gymnasium",
    "tensordict",
    "matplotlib",
    "pillow",
    "imageio",
    "einops",
    "wandb",
    "tqdm",
    "pyyaml",
    "typing_extensions",
    "pandas",
    "pygame",
]

[project.optional-dependencies]
envs = [
    "pettingzoo",
    "catanatron",
    "rlcard",
    "easydict",
]
examples = [
    "ray",
    "torchvision",
    "gym_microrts",
]
test = [
    "pytest>=7.0",
    "pytest-cov",
    "pytest-rerunfailures",
]
plot = [
    "SciencePlots>=2.1.0",
    "catppuccin-matplotlib>=0.5",
    "mplcyberpunk>=0.7.1",
    "matplotx>=0.3.10",
    "aquarel>=0.0.6",
    "qbstyles>=0.1.4",
]

[tool.setuptools.packages.find]
include = ["*", "custom_gym_envs_pkg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["functional", "networks"]
omit = [
    "**/deprecated/**",
    "tests/**",
    "experiments/**",
    "scripts/**",
    "**/__init__.py",
]

[tool.coverage.report]
omit = [
    "**/deprecated/**",
    "tests/**",
    "experiments/**",
    "scripts/**",
    "**/__init__.py",
]
